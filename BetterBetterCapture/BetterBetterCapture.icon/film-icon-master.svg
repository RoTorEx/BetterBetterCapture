<?xml version="1.0" encoding="UTF-8"?>
<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#0f0f1a"/>
    </linearGradient>
    <linearGradient id="reel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8f9fa"/>
      <stop offset="100%" stop-color="#d1d5db"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  
  <!-- Rounded square background -->
  <rect x="64" y="64" width="896" height="896" rx="224" ry="224" fill="url(#bg)"/>
  
  <!-- Film reel/tape icon group -->
  <g transform="translate(512 512)" filter="url(#shadow)">
    <!-- Outer reel ring -->
    <circle cx="0" cy="0" r="260" fill="none" stroke="url(#reel)" stroke-width="48"/>
    
    <!-- Inner hub -->
    <circle cx="0" cy="0" r="72" fill="url(#reel)"/>
    
    <!-- Spokes / sprocket holes -->
    <g fill="url(#reel)">
      <circle cx="0" cy="-148" r="36"/>
      <circle cx="128" cy="-74" r="36"/>
      <circle cx="128" cy="74" r="36"/>
      <circle cx="0" cy="148" r="36"/>
      <circle cx="-128" cy="74" r="36"/>
      <circle cx="-128" cy="-74" r="36"/>
    </g>
    
    <!-- Film strip tail -->
    <path d="M 160 160 L 320 320 L 320 420 L 160 420 L 60 320 Z" fill="url(#reel)" opacity="0.95"/>
    <rect x="200" y="360" width="40" height="40" rx="10" fill="#1a1a2e"/>
    <rect x="280" y="360" width="20" height="40" rx="6" fill="#1a1a2e"/>
  </g>
</svg>