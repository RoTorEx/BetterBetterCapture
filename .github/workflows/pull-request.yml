name: Swift CI

on:
  push:
    branches: [main]
    paths:
      - '**.swift'
      - '**.xcodeproj/**'
      - '**.xctestplan'
      - '.swiftlint.yml'
      - 'Makefile'
      - 'scripts/release.sh'
      - '.github/workflows/pull-request.yml'
  pull_request:
    branches: [main]
    paths:
      - '**.swift'
      - '**.xcodeproj/**'
      - '**.xctestplan'
      - '.swiftlint.yml'
      - 'Makefile'
      - 'scripts/release.sh'
      - '.github/workflows/pull-request.yml'

env:
  XCODE_VERSION: '26.0'

jobs:
  quality:
    name: Verify
    runs-on: macos-26
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode version
        run: sudo xcode-select -s /Applications/Xcode_${{ env.XCODE_VERSION }}.app

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install tools
        run: make install

      - name: Run verification
        run: make check
